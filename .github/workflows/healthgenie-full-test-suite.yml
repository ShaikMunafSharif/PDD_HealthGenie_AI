name: HealthGenie Master E2E Automated Test Suite (Selenium & Appium)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-web-e2e:
    name: 🌐 Selenium Web E2E Test Suite (300+ Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Install Selenium Test Dependencies
        run: |
          cd selenium-tests
          npm install --legacy-peer-deps

      - name: Start Web Frontend Dev Server
        run: |
          cd frontend
          npm run dev &
          sleep 5

      - name: Execute Selenium E2E Test Suite
        env:
          BASE_URL: 'http://localhost:5173'
        run: |
          cd selenium-tests
          npm test

      - name: Upload Selenium Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-E2E-Report-300+
          path: selenium-tests/selenium_test_report.xlsx
          retention-days: 30

  appium-mobile-e2e:
    name: 📱 Appium Mobile E2E Test Suite (300+ Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium Test Dependencies
        run: |
          cd appium-tests
          npm install --legacy-peer-deps

      - name: Execute Appium Mobile E2E Test Suite
        run: |
          cd appium-tests
          npm test

      - name: Upload Appium Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-E2E-Report-300+
          path: appium-tests/appium_test_report.xlsx
          retention-days: 30
