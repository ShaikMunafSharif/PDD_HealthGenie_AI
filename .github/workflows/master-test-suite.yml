name: HealthGenie Master Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-web-e2e:
    name: 🌐 Selenium Web E2E Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Install Selenium Test Dependencies
        run: |
          cd selenium-tests
          npm install --legacy-peer-deps

      - name: Start Web Frontend Dev Server
        run: |
          cd frontend
          npm run dev &
          sleep 5

      - name: Execute Selenium E2E Test Suite
        env:
          BASE_URL: 'http://localhost:5173'
        run: |
          cd selenium-tests
          npm test || true

      - name: Upload Selenium Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-E2E-Report
          path: selenium-tests/selenium_test_report.xlsx
          retention-days: 30

  appium-mobile-e2e:
    name: 📱 Appium Mobile E2E Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium Test Dependencies
        run: |
          cd appium-tests
          npm install --legacy-peer-deps

      - name: Execute Appium Mobile E2E Test Suite
        run: |
          cd appium-tests
          npm test || true

      - name: Upload Appium Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-E2E-Report
          path: appium-tests/appium_test_report.xlsx
          retention-days: 30

  loadtest:
    name: 🚀 LoadTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install --legacy-peer-deps

      - name: Start Backend Server
        run: |
          cd backend
          npm start &
          sleep 5

      - name: Install Performance Test Dependencies
        run: |
          cd performance-tests
          npm install --legacy-peer-deps

      - name: Execute Performance Test Suite
        env:
          TARGET_URL: 'http://localhost:5000/api/config'
        run: |
          cd performance-tests
          node run-tests.js || true

      - name: Upload LoadTest Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoadTest
          path: performance-tests/performance_test_report.xlsx
          retention-days: 30

  security-scan:
    name: 🛡️ Defensive Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run NPM Audit (Backend)
        working-directory: ./backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/security-audit"
          generateSarif: "1"
        continue-on-error: true

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-scan
