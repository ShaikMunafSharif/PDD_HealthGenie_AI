name: HealthGenie Selenium E2E Automated Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Run Selenium E2E Tests & Excel Generator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Install Selenium Test Dependencies
        run: |
          cd selenium-tests
          npm install --legacy-peer-deps

      - name: Start Web Frontend Dev Server
        run: |
          cd frontend
          npm run dev &
          sleep 5

      - name: Execute Selenium E2E Test Suite
        env:
          BASE_URL: 'http://localhost:5173'
        run: |
          cd selenium-tests
          npm test

      - name: Upload Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthGenie-Selenium-E2E-Report-300+
          path: selenium-tests/selenium_test_report.xlsx
          retention-days: 30
