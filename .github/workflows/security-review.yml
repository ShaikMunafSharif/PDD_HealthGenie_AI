name: HealthGenie Backend Security & Code Quality Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: 🛡️ Security Audit & Vulnerability Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
        continue-on-error: true

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Run Node Dependency Audit
        run: |
          cd backend
          npm audit --audit-level=critical
        continue-on-error: true

      - name: Upload Security Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthGenie-Security-Review-Reports
          path: Vulnerability Test Results/
          retention-days: 30
