name: HealthGenie Performance & Load Testing Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  performance-tests:
    name: 🚀 API Performance, Load, Stress, Spike & Soak Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start MongoDB (Service)
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '6.0'
          
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install --legacy-peer-deps

      - name: Start Backend Server
        run: |
          cd backend
          npm start &
          sleep 5

      - name: Install Performance Test Dependencies
        run: |
          cd performance-tests
          npm install --legacy-peer-deps

      - name: Execute Performance Test Suite
        env:
          TARGET_URL: 'http://localhost:5000/api/config'
        run: |
          cd performance-tests
          node run-tests.js

      - name: Upload Performance Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthGenie-Performance-Test-Report
          path: performance-tests/performance_test_report.xlsx
          retention-days: 30
